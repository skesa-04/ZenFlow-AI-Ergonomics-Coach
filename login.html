<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon: #800000;
            --green: #27ae60;
            --bg-light: #f0f4f8;
            --text-gray: #555;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Main White Container */
        .main-card {
            background: white;
            width: 1000px;
            height: 600px;
            display: flex;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-radius: 8px; /* Slight rounding for the main container */
            overflow: hidden;
        }

        /* Left Side: Illustration */
        .left-side {
            flex: 1.2;
            background-color: #f9fbff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .left-side img {
            max-width: 100%;
            height: auto;
        }

        /* Right Side: Form Area */
        .right-side {
            flex: 0.8;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            color: var(--maroon);
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-gray);
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        /* Sharp Text Boxes */
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            background: #fcfcfc;
            border-radius: 0px; /* Sharp Edges */
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--green);
            outline: none;
        }

        /* Green Login Button */
        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--green);
            color: white;
            border: none;
            border-radius: 0px; /* Sharp Edges */
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #219150;
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #777;
        }

        .footer-links a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="left-side">
            <img src="{{ url_for('static', filename='illustration-depicting-corporate-job.jpg') }}" alt="Illustration">
        </div>

        <div class="right-side">
            <h2>Welcome Back :)</h2>
            <p class="subtitle">To keep connected with us please login with your personal information.</p>

            <form action="/login" method="POST">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Login Now</button>
            </form>

            <div class="footer-links">
                New here? <a href="/register">Create Account</a>
            </div>
        </div>
    </div>

</body>
</html>
